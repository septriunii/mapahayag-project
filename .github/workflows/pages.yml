name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # handled manually below for sparse checkout

      # Fetch the pinned datasets the React build copies into its output.
      - name: Sparse-checkout geo data
        run: |
          SUBMODULE_URL=$(git config --file .gitmodules submodule.philippines-json-maps.url)
          SUBMODULE_SHA=$(git ls-tree HEAD philippines-json-maps | awk '{print $3}')

          git clone \
            --no-checkout \
            --depth=1 \
            --filter=blob:none \
            "$SUBMODULE_URL" \
            philippines-json-maps

          git -C philippines-json-maps sparse-checkout init --cone
          git -C philippines-json-maps sparse-checkout set \
            2023/geojson/country/lowres \
            2023/geojson/regions/lowres \
            2023/geojson/provdists/lowres \
            2023/geojson/provdists/medres \
            2023/geojson/municities/medres \
            2023/geojson/municities/hires

          git -C philippines-json-maps fetch --depth=1 origin "$SUBMODULE_SHA"
          git -C philippines-json-maps checkout "$SUBMODULE_SHA"

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React for GitHub Pages
        working-directory: react-app
        run: |
          npx --yes pnpm@11.25.0 install --frozen-lockfile
          npx --yes pnpm@11.25.0 run build --base ./
          npx --yes pnpm@11.25.0 run check:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

      - uses: actions/deploy-pages@v4
        id: deployment
